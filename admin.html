<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniBite - Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <header class="text-center py-4 bg-white shadow-sm mb-5">
        <h1 class="text-primary fw-bold" style="color: #ce7961 !important;">UniBite Admin</h1>
        <p class="text-secondary mb-0">Dashboard & Statistics</p>
    </header>

    <main class="container">
        <section id="adminAuth" class="text-center mt-5">
            <div class="alert alert-warning d-inline-block shadow-sm">
                <p class="mb-3 fs-5">You must be logged in as Admin to view this page.</p>
                <a href="index.html" class="btn btn-primary">← Back to main page</a>
            </div>
        </section>

        <section id="adminContent" style="display:none;">
            <h2 class="mb-4 text-secondary border-bottom pb-2">📊 Monthly Statistics</h2>
            <div id="statsContainer" class="row g-4 mb-5"></div>

            <h2 class="mb-4 text-secondary border-bottom pb-2">🏆 Top Donors Leaderboard</h2>
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table id="leaderboardTable" class="table table-hover table-striped mb-0 text-center align-middle">
                            <thead class="table-light">
                                <tr>
                                   <th class="py-3">#</th>
                                   <th class="py-3 text-start">Cook</th>
                                   <th class="py-3">Portions Shared</th>
                                   <th class="py-3">Avg Rating</th>
                                   <th class="py-3">Total Points</th>
                                </tr>
                            </thead>
                            <tbody id="leaderboardBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <button id="backBtn" onclick="window.location.href='index.html'" class="btn btn-secondary mb-5 shadow-sm">← Back to Feed</button>
        </section>
    </main>
    <script src="admin.js"></script>
</body>
</html>
